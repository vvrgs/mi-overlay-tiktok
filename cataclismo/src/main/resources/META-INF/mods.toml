modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# AAA Particles (Effekseer) es 100% opcional: el puente es por reflexion y se
# auto-desactiva si no esta. Se declara solo para el orden de carga.
[[dependencies.${mod_id}]]
    modId="aaa_particles"
    mandatory=false
    versionRange="[1.20.1-1.4,)"
    ordering="AFTER"
    side="BOTH"
